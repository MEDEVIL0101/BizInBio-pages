    <header style="padding:0 var(--space-4) var(--space-4);text-align:center">

    </header><section style="padding:0 var(--space-4) var(--space-6);text-align:center"><p style="font-size:13.5px;line-height:1.55;opacity:.85">Lamborghini Miami has been a staple here in Miami and throughout South Florida for over 40 years! Customers throughout the area can visit our dealership to explore our excellent inventory of pre-owned Lamborghini models today!</p></section>
    <section style="padding:0 var(--space-4) var(--space-6)">
    <h6 style="color:var(--color-accent-700);margin-bottom:var(--space-3)">Request a quote</h6>
    <div class="field"><label>Name</label><input class="input" id="bib-q-name-7dffa189-185c-485c-8cad-f848b50979ae" /></div><div class="field"><label>Email</label><input class="input" type="email" id="bib-q-email-7dffa189-185c-485c-8cad-f848b50979ae" /></div><div class="field"><label>Project details</label><textarea class="input" id="bib-q-details-7dffa189-185c-485c-8cad-f848b50979ae" placeholder="Tell us what you need"></textarea></div>
    <button id="bib-quote-submit-7dffa189-185c-485c-8cad-f848b50979ae" class="btn btn-primary btn-block">Send request</button>
    <p id="bib-quote-status-7dffa189-185c-485c-8cad-f848b50979ae" class="text-muted" style="text-align:center;font-size:12px;margin-top:var(--space-2)"></p></section>
    <script>
      (function () {
        var suffix = "7dffa189-185c-485c-8cad-f848b50979ae";
        var nameEl = document.getElementById('bib-q-name-' + suffix);
        var emailEl = document.getElementById('bib-q-email-' + suffix);
        var phoneEl = document.getElementById('bib-q-phone-' + suffix);
        var addressEl = document.getElementById('bib-q-address-' + suffix);
        var detailsEl = document.getElementById('bib-q-details-' + suffix);
        var status = document.getElementById('bib-quote-status-' + suffix);
        var storageKey = 'bib_lp_' + "8e288a6e-5397-45f3-a64a-d3271fab9325" + '_' + suffix;
        var overlay = document.getElementById('bib-lp-overlay-' + suffix);

        if (overlay) {
          var seen = null;
          try { seen = localStorage.getItem(storageKey); } catch (e) {}
          var cooldownMs = 7 * 24 * 60 * 60 * 1000;
          var shouldShow = seen !== 'submitted' && (!seen || (Date.now() - Number(seen)) > cooldownMs);
          if (shouldShow) {
            setTimeout(function () { overlay.style.display = 'flex'; }, 5000);
          }
          var closeBtn = document.getElementById('bib-lp-close-' + suffix);
          if (closeBtn) closeBtn.addEventListener('click', function () {
            overlay.style.display = 'none';
            try { localStorage.setItem(storageKey, String(Date.now())); } catch (e) {}
          });
          overlay.addEventListener('click', function (e) {
            if (e.target === overlay) closeBtn.click();
          });
        }

        document.getElementById('bib-quote-submit-' + suffix).addEventListener('click', async function () {
          status.textContent = 'Sending...';
          var payload = {
            page_id: "8e288a6e-5397-45f3-a64a-d3271fab9325",
            name: nameEl ? nameEl.value : null,
            email: emailEl ? emailEl.value : null,
            phone: phoneEl ? phoneEl.value : null,
            address: addressEl ? addressEl.value : null,
            contact_info: [emailEl ? emailEl.value : '', phoneEl ? phoneEl.value : ''].filter(Boolean).join(', ') || null,
            message: detailsEl ? detailsEl.value : null
          };
          try {
            var res = await fetch("https://eqsxcbmcsjrtnkevaygy.supabase.co" + '/rest/v1/quote_requests', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'apikey': "sb_publishable_DPifKzXa875ieM2CLgMieA_VJyYRa-6",
                'Authorization': 'Bearer ' + "sb_publishable_DPifKzXa875ieM2CLgMieA_VJyYRa-6"
              },
              body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('failed');
            status.textContent = 'Thanks! Your request was sent.';
            [nameEl, emailEl, phoneEl, addressEl, detailsEl].forEach(function (el) { if (el) el.value = ''; });
            try { localStorage.setItem(storageKey, 'submitted'); } catch (e) {}
            if (overlay) setTimeout(function () { overlay.style.display = 'none'; }, 1800);
          } catch (err) {
            status.textContent = 'Something went wrong — please try again.';
          }
        });
      })();
    </script><div class="social-row" style="padding:0 var(--space-4) var(--space-6)"><a href="https://configurator.lamborghini.com/configurator/model/32005-20111/MBV-24727-2027?loungeMode=false&amp;lang=eng&amp;country=ca" class="bib-link-image" target="_blank" rel="noopener" style=""><img src="https://eqsxcbmcsjrtnkevaygy.supabase.co/storage/v1/object/public/page-photos/8e9da974-cbfa-4e56-ab36-df345cc7d18a/1786909221284-UrusCard.png" alt="Link" /></a></div>
    <div style="padding:0 var(--space-4) var(--space-6)">
      
      <button id="bib-booking-btn" class="btn btn-primary btn-block">Book now</button>
      <p id="bib-booking-status" class="text-muted" style="text-align:center;font-size:12px;margin-top:var(--space-2)"></p>
    </div>
    <script>
      document.getElementById('bib-booking-btn').addEventListener('click', async function () {
        var status = document.getElementById('bib-booking-status');
        status.textContent = 'Redirecting to checkout...';
        try {
          var res = await fetch("https://eqsxcbmcsjrtnkevaygy.supabase.co" + '/functions/v1/create-booking-checkout', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': "sb_publishable_DPifKzXa875ieM2CLgMieA_VJyYRa-6",
              'Authorization': 'Bearer ' + "sb_publishable_DPifKzXa875ieM2CLgMieA_VJyYRa-6"
            },
            body: JSON.stringify({ page_id: "8e288a6e-5397-45f3-a64a-d3271fab9325" })
          });
          var data = await res.json();
          if (!res.ok || !data.url) throw new Error('failed');
          window.location.href = data.url;
        } catch (err) {
          status.textContent = 'Something went wrong — please try again.';
        }
      });
    </script><footer style="padding:var(--space-6) var(--space-4);text-align:center;border-top:1px solid var(--color-divider)">

    </a>
