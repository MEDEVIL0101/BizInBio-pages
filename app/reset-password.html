<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — BizInBio</title>
<link rel="icon" href="../assets/favicon-32.png?v=1" />
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png?v=1" />
<link rel="stylesheet" href="../assets/site.css?v=22" />
</head>
<body>
<div style="max-width:400px;margin:0 auto;padding:calc(var(--space-8)*2) var(--space-4)">

  <div style="text-align:center;margin-bottom:var(--space-6)">
    <span class="nav-brand" style="font-size:24px">Biz<span style="color:var(--color-accent)">In</span>Bio</span>
  </div>

  <div class="blueprint" style="position:relative;padding:var(--space-6)">
    <div id="loading-state" style="text-align:center">
      <p class="text-muted" style="font-size:14px">Checking your reset link...</p>
    </div>

    <div id="form-state" style="display:none">
      <h4 class="card-title" style="font-size:19px;text-align:center">Set a new password</h4>
      <form id="reset-form" style="display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-4)">
        <input class="input" type="password" name="password" placeholder="New password" required minlength="6" />
        <input class="input" type="password" name="confirm" placeholder="Confirm new password" required minlength="6" />
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:var(--space-2)">Set new password</button>
      </form>
      <p class="text-muted" style="text-align:center;font-size:13px;margin-top:var(--space-3);min-height:18px" id="msg"></p>
    </div>

    <div id="invalid-state" style="display:none;text-align:center">
      <p class="text-muted" style="font-size:14px">This reset link is invalid or has expired.</p>
      <a href="/app/index.html" style="display:block;text-align:center;font-size:13px;margin-top:var(--space-3)">Back to sign in</a>
    </div>

    <div id="success-state" style="display:none;text-align:center">
      <p class="text-muted" style="font-size:14px">Your password has been updated.</p>
      <a href="/app/index.html" class="btn btn-primary btn-block" style="margin-top:var(--space-4)">Sign in</a>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js?v=13"></script>
<script>
  // Supabase's password-recovery redirect lands here with a recovery token
  // in the URL — supabase-js auto-exchanges it for a session on load
  // (detectSessionInUrl defaults to true) and fires PASSWORD_RECOVERY.
  const loadingState = document.getElementById("loading-state");
  const formState = document.getElementById("form-state");
  const invalidState = document.getElementById("invalid-state");
  const successState = document.getElementById("success-state");
  const resetForm = document.getElementById("reset-form");
  const msg = document.getElementById("msg");

  let recoveryConfirmed = false;

  sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      recoveryConfirmed = true;
      loadingState.style.display = "none";
      formState.style.display = "block";
    }
  });

  // If the tab already had a valid recovery session by the time this script
  // runs (event fired before the listener attached), fall back to checking
  // for a session directly rather than getting stuck on "Checking...".
  (async () => {
    await new Promise((r) => setTimeout(r, 800));
    if (recoveryConfirmed) return;
    const { data: { session } } = await sb.auth.getSession();
    loadingState.style.display = "none";
    if (session) {
      formState.style.display = "block";
    } else {
      invalidState.style.display = "block";
    }
  })();

  resetForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = e.target.password.value;
    const confirm = e.target.confirm.value;
    if (password !== confirm) {
      msg.textContent = "Passwords don't match.";
      return;
    }
    msg.textContent = "Updating...";
    try {
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      formState.style.display = "none";
      successState.style.display = "block";
    } catch (err) {
      msg.textContent = err.message || "Something went wrong.";
    }
  });
</script>
</body>
</html>
