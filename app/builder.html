<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page builder — BizInBio</title>
<link rel="icon" href="../assets/favicon-32.png?v=1" />
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png?v=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&family=Pacifico&family=Nunito:wght@400;500;600;700&family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/bib-chrome.css?v=2" />
<style>
  /* Builder-only layout/components — shared chrome (tokens, top bar,
     cards, fields, buttons, toggles) lives in bib-chrome.css so
     dashboard.html can match this look without duplicating it. */
  .bib-app{height:100vh;overflow:hidden;display:flex;flex-direction:column}
  .bib-body{flex:1;display:flex;overflow:hidden;position:relative}
  .bib-editor{width:460px;flex-shrink:0;overflow-y:auto;padding:28px 24px 80px;display:flex;flex-direction:column;gap:18px;background:var(--bib-panel-bg);border-right:1px solid var(--bib-border)}
  .bib-card-head{margin-bottom:4px}

  .bib-swatch{width:42px;height:42px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.1);transition:transform .15s ease;padding:0}
  .bib-swatch:hover{transform:scale(1.08)}
  .bib-swatch.sel::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--swatch-ring, currentColor)}
  .bib-custom-swatch{background:conic-gradient(from 0deg,#ff6b4a,#ffd166,#4dd6a8,#4a9bff,#b46bff,#ff6b4a)}

  /* Color field rows — Accent/Background/Text/Button/Shop card all share this
     one row shape (label above, swatch button + status text + reset), and
     the swatch button opens the same curated-palette popover rather than a
     native OS color picker. */
  .bib-color-field{position:relative;display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .bib-color-field:last-of-type{margin-bottom:0}
  .bib-color-swatch-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--bib-border);cursor:pointer;padding:0;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .bib-color-swatch-btn:hover{border-color:var(--bib-accent)}
  .bib-color-popover{position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:270px;background:#fff;border:1px solid var(--bib-border);border-radius:16px;box-shadow:0 12px 28px rgba(0,0,0,.14);padding:14px;animation:cardIn .15s ease both}
  .bib-color-family{margin-bottom:10px}
  .bib-color-family:last-child{margin-bottom:0}
  .bib-color-family-label{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--bib-muted);margin-bottom:6px}
  .bib-color-grid{display:flex;flex-wrap:wrap;gap:7px}
  .bib-color-cell{width:28px;height:28px;border-radius:8px;border:1.5px solid rgba(0,0,0,.06);cursor:pointer;padding:0;position:relative;flex:none}
  .bib-color-cell:hover{transform:scale(1.08)}
  .bib-color-cell.sel::after{content:"";position:absolute;inset:-4px;border-radius:10px;border:2px solid var(--bib-accent)}
  .bib-color-popover-footer{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--bib-border)}
  .bib-color-hex-input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;background:oklch(97% 0.01 70);border:1.5px solid var(--bib-border);font-size:12.5px;font-family:var(--bib-mono,monospace);outline:none;color:var(--bib-text)}
  .bib-color-hex-input:focus-visible{border-color:var(--bib-accent)}
  .bib-color-native-input{width:32px;height:32px;border:1.5px solid var(--bib-border);border-radius:8px;padding:0;cursor:pointer;flex:none}

  .bib-fontpair-btn{text-align:left;padding:12px;border-radius:14px;background:oklch(97% 0.01 70);border:1.5px solid transparent;cursor:pointer}
  .bib-fontpair-btn:hover{background:oklch(95% 0.015 70)}
  .bib-fontpair-btn.sel{border-color:var(--bib-accent);background:oklch(96% 0.05 30)}
  .bib-shape-btn{padding:7px 12px;border-radius:8px;background:oklch(97% 0.01 70);border:1.5px solid transparent;cursor:pointer;font-size:12px;color:var(--bib-muted)}
  .bib-shape-btn:hover{background:oklch(95% 0.015 70)}
  .bib-shape-btn.sel{border-color:var(--bib-accent);background:oklch(96% 0.05 30);color:var(--bib-text)}
  .bib-fontpair-aa{font-size:19px;font-weight:700;margin-bottom:2px}
  .bib-fontpair-name{font-size:12px;font-weight:600;color:oklch(35% 0.02 50)}

  .bib-el-card{background:var(--bib-card-bg);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 20px oklch(60% 0.03 60 / .05);animation:cardIn .35s ease backwards;border:1px solid var(--bib-border)}
  .bib-el-card.drag-over{border:2px dashed var(--bib-accent)}
  .bib-el-card.bib-drag-lift{opacity:.4}
  .bib-el-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}
  .bib-drag-handle{cursor:grab;touch-action:none;color:oklch(75% 0.01 60);padding:10px;margin:-10px;flex:none;display:flex;align-items:center;justify-content:center;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .bib-el-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .bib-el-title{font-size:14px;font-weight:700}
  .bib-el-summary{font-size:12px;color:var(--bib-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bib-chevron{color:var(--bib-muted);display:flex;flex:none;transition:transform .2s ease;padding:6px;border-radius:8px}
  .bib-chevron:hover{background:oklch(94% 0.02 60)}
  .bib-el-panel{padding:4px 16px 18px}

  .bib-gated-banner{display:flex;align-items:flex-start;gap:10px;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.5}
  .bib-gated-banner svg{flex-shrink:0;margin-top:2px}

  .bib-gallery-tile{cursor:pointer}
  .bib-gallery-tile.sel{box-shadow:0 0 0 3px var(--bib-accent)}

  .bib-add-section-btn{width:100%;padding:14px;border-radius:14px;border:1.5px dashed oklch(82% 0.02 60);background:#fff;color:var(--bib-muted);font-weight:700;font-size:13.5px;cursor:pointer}
  .bib-add-section-btn:hover{border-color:var(--bib-accent);color:var(--bib-accent)}
  .bib-add-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bib-add-card{text-align:left;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--bib-border);cursor:pointer;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .bib-add-card .bib-add-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .bib-add-card .bib-add-title{font-size:14.5px;font-weight:700}
  .bib-all-access-badge{position:absolute;top:12px;right:12px;background:oklch(93% 0.09 150);color:oklch(38% 0.13 150);font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:4px 8px;border-radius:999px}

  .bib-preview-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:auto;padding:40px}
  .bib-preview-label{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bib-muted);display:flex;align-items:center;gap:6px}
  .bib-phone{width:auto;height:min(844px, calc(100vh - 180px));aspect-ratio:390/844;max-width:100%;border-radius:52px;border:10px solid #111;background:#111;box-shadow:0 30px 60px rgba(0,0,0,.25);overflow:hidden;position:relative;flex-shrink:0}
  .bib-phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#111;border-radius:0 0 16px 16px;z-index:5}
  /* The iframe always renders at true device CSS pixels (390x844 — a real
     phone's viewport), so every media query inside it evaluates exactly
     like it would on an actual phone regardless of how small the bezel
     graphic above gets squeezed on a short browser window. The bezel
     shrinking is then purely a visual CSS transform:scale() of that fixed
     canvas (see scalePreviewToFit() below), not a change to the content's
     actual rendered pixel size — otherwise fixed-px elements (like the
     120px avatar) end up looking oversized relative to a shrunken frame
     even though their real, on-device size is correct. */
  .bib-phone-screen{width:390px;height:844px;overflow-y:auto;background:#fff;border:0;display:block;transform-origin:top left}

  /* Mobile Edit/Preview switch — .bib-body is a side-by-side flex on
     desktop (editor panel + phone preview both visible at once), which on
     a phone-width viewport left the 460px-wide editor alone wider than the
     screen, pushing the preview off to the side entirely (only reachable
     by rotating to landscape, where it then rendered squashed into
     whatever sliver of width was left). Below the breakpoint this switches
     to showing exactly one full-width pane at a time, chosen by the tab
     bar — the phone mockup then gets its full intended width/aspect-ratio
     instead of being squeezed. Desktop layout (the flex row) is untouched. */
  .bib-mobile-tabs{display:none}
  @media (max-width: 860px){
    .bib-mobile-tabs{display:flex;gap:8px;padding:10px 16px;background:var(--bib-panel-bg);border-bottom:1px solid var(--bib-border);position:sticky;top:72px;z-index:29}
    .bib-mobile-tab{flex:1;text-align:center;padding:9px 0;border-radius:10px;border:1.5px solid var(--bib-border);background:#fff;font-weight:700;font-size:13.5px;color:var(--bib-muted);cursor:pointer}
    .bib-mobile-tab.active{background:var(--bib-accent);border-color:var(--bib-accent);color:#fff}
    .bib-editor{width:100%}
    .bib-preview-wrap{padding:20px}
    .bib-body.bib-mobile-preview .bib-editor{display:none}
    .bib-body:not(.bib-mobile-preview) .bib-preview-wrap{display:none}

    /* The topbar was built for desktop width — back-button label, the
       "builder" wordmark tag, and the url pill together left no room on a
       phone screen, pushing the Live badge/Save button off the right edge.
       The url pill's own job (seeing what the page will look like) is now
       covered by the Edit/Preview toggle above, so it's dropped here rather
       than squeezed; everything else just loses its text/decoration and
       keeps working as icon-only. */
    .bib-topbar{padding:0 14px;gap:8px}
    .bib-topbar > div{gap:8px !important}
    .bib-back-label,.bib-wordmark-label,.bib-divider-v,#page-url{display:none}
    .bib-live-pill{padding:6px 10px;font-size:12px;white-space:nowrap}
    .bib-save-btn{padding:9px 14px;font-size:13px;white-space:nowrap}
  }
</style>
</head>
<body>

<div class="bib-app">
  <div class="bib-topbar">
    <div style="display:flex;align-items:center;gap:20px">
      <a href="/app/dashboard.html" class="bib-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="bib-back-label">Back to dashboard</span>
      </a>
      <div class="bib-divider-v"></div>
      <div class="bib-wordmark">
        <img src="../assets/bee-icon.png?v=1" alt="BizInBio" class="bib-wordmark-mark" />
        <span class="bib-wordmark-text">Biz<span class="accent">In</span>Bio</span>
        <span class="bib-wordmark-label">builder</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <a id="page-url" class="bib-url-pill" href="#" target="_blank" rel="noopener"></a>
      <a id="status-badge" class="bib-live-pill" href="#" target="_blank" rel="noopener" style="cursor:pointer"><span class="bib-live-dot"></span><span id="status-badge-text">Live</span></a>
      <button id="save-republish-btn" class="bib-save-btn" type="button">Save &amp; publish</button>
    </div>
  </div>

  <div class="bib-mobile-tabs" id="mobile-view-tabs">
    <button type="button" class="bib-mobile-tab active" data-view="edit">Edit</button>
    <button type="button" class="bib-mobile-tab" data-view="preview">Preview</button>
  </div>

  <div class="bib-body" id="bib-body">
    <div class="bib-editor" id="editor-panel"></div>
    <div class="bib-preview-wrap">
      <div class="bib-preview-label">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 4a8 8 0 100 16 8 8 0 000-16z" stroke="currentColor" stroke-width="2"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Live preview
      </div>
      <div class="bib-phone">
        <div class="bib-phone-notch"></div>
        <iframe class="bib-phone-screen" id="preview-screen" title="Live preview" sandbox="allow-scripts"></iframe>
      </div>
    </div>
  </div>

  <div class="bib-toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js?v=13"></script>
<script>
  // ---------------------------------------------------------------------
  // Section catalog — title/hue/paywalled/icon per non-header element type.
  // Icon bubble and paywall-banner colors are both derived from `hue` via
  // one consistent oklch formula (see hueBg/hueFg/hueBannerBg/hueBannerFg
  // below) rather than hand-tuning each — visually equivalent to the design
  // handoff's per-type values, far less code to keep in sync.
  // Ordered to match a logical build-up of the site: say who you are and
  // how to reach you, then show proof of work, then describe what you
  // offer, then take payment — not alphabetical or arbitrary. Drives both
  // the "+ Add section" grid order and (via ALL_SECTION_TYPES) anywhere
  // else that lists every section type in a fixed order.
  const SECTION_META = {
    about: { title: "About", hue: 250, paywalled: false,
      icon: `<path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/>` },
    contact: { title: "Contact", hue: 30, paywalled: false,
      icon: `<path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.2 2.2z" stroke-linejoin="round"/>` },
    social_link: { title: "Social & links", hue: 190, paywalled: false,
      icon: `<path d="M10 13a5 5 0 007.07 0l2-2a5 5 0 00-7.07-7.07l-1 1M14 11a5 5 0 00-7.07 0l-2 2a5 5 0 007.07 7.07l1-1" stroke-linecap="round"/>` },
    portfolio_gallery: { title: "Gallery", hue: 320, paywalled: true,
      icon: `<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 17l5-4 4 3 4-5 5 6" stroke-linecap="round" stroke-linejoin="round"/>` },
    youtube_video: { title: "YouTube videos", hue: 0, paywalled: true,
      icon: `<circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/>` },
    services_list: { title: "Services", hue: 90, paywalled: true,
      icon: `<path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/><circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"/>` },
    service_area: { title: "Service area", hue: 150, paywalled: true,
      icon: `<path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.3"/>` },
    quote_request_form: { title: "Quote / lead capture form", hue: 350, paywalled: true,
      icon: `<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke-linecap="round"/>` },
    booking_deposit: { title: "Booking deposit", hue: 270, paywalled: true,
      icon: `<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4" stroke-linecap="round"/>` },
    booking_calendar: { title: "Book a call", hue: 210, paywalled: true,
      icon: `<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4" stroke-linecap="round"/><path d="M9 14l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>` },
    product_shop: { title: "Shop", hue: 55, paywalled: true,
      icon: `<path d="M6 8h12l-1 12a2 2 0 01-2 2H9a2 2 0 01-2-2L6 8z" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 016 0v2"/>` },
  };
  const ALL_SECTION_TYPES = Object.keys(SECTION_META);

  function hueBg(hue) { return `oklch(90% 0.05 ${hue})`; }
  function hueFg(hue) { return `oklch(49% 0.16 ${hue})`; }
  function hueBannerBg(hue) { return `oklch(95% 0.05 ${hue})`; }
  function hueBannerFg(hue) { return `oklch(30% 0.1 ${hue})`; }

  function sectionIconSvg(type, size) {
    const meta = SECTION_META[type];
    if (!meta) return "";
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${meta.icon}</svg>`;
  }

  function escapeHtml(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Mirrors contrastTextColor in render-page/index.ts — used here only to
  // preview what the auto-picked text color will be against a chosen
  // Custom background, not as the source of truth (the real page always
  // computes this server-side at publish time).
  function relativeLuminance(hex) {
    const clean = String(hex || "").replace("#", "").trim();
    const full = clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean;
    const r = parseInt(full.substring(0, 2), 16) / 255;
    const g = parseInt(full.substring(2, 4), 16) / 255;
    const b = parseInt(full.substring(4, 6), 16) / 255;
    const lin = (v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  }
  function contrastRatio(l1, l2) {
    const lighter = Math.max(l1, l2), darker = Math.min(l1, l2);
    return (lighter + 0.05) / (darker + 0.05);
  }
  function contrastTextColor(hex, darkColor) {
    try {
      const bgLum = relativeLuminance(hex);
      const whiteContrast = contrastRatio(bgLum, 1);
      const blackContrast = contrastRatio(bgLum, relativeLuminance(darkColor));
      return whiteContrast >= blackContrast ? "#FFFFFF" : darkColor;
    } catch {
      return "#FFFFFF";
    }
  }

  // Users routinely type "instagram.com/handle" instead of a full URL —
  // without a scheme that renders as a link relative to the page itself,
  // a 404. Default to https:// whenever no scheme is present.
  function normalizeUrl(raw) {
    const url = String(raw || "").trim();
    if (!url) return "";
    return /^[a-z][a-z0-9+.-]*:/i.test(url) ? url : `https://${url}`;
  }

  const UP_ICON = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`;
  const DOWN_ICON = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>`;
  const TRASH_ICON = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m2 0v13a2 2 0 01-2 2H9a2 2 0 01-2-2V7h10z"/></svg>`;
  const CHEVRON_ICON = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
  const GRIP_ICON = `<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="5" cy="3" r="1.4"/><circle cx="11" cy="3" r="1.4"/><circle cx="5" cy="8" r="1.4"/><circle cx="11" cy="8" r="1.4"/><circle cx="5" cy="13" r="1.4"/><circle cx="11" cy="13" r="1.4"/></svg>`;
  const UPLOAD_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>`;
  const CLOSE_ICON = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

  const CONTACT_ICONS = {
    phone: `<path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.2 2.2z" stroke-linejoin="round"/>`,
    email: `<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 6.5l8 6 8-6" stroke-linecap="round" stroke-linejoin="round"/>`,
    whatsapp: `<path d="M12 3a9 9 0 00-7.8 13.4L3 21l4.7-1.2A9 9 0 1012 3z" stroke-linejoin="round"/><path d="M8.5 12a3.5 3.5 0 007 0" stroke-linecap="round"/>`,
  };
  function contactIconSvg(type, size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${CONTACT_ICONS[type] || ""}</svg>`;
  }

  // ---------------------------------------------------------------------
  // Drag-and-drop — Pointer Events, not the HTML5 native DnD API (no
  // reliable touch support there, and this app's usage skews mobile).
  //
  // Deliberately never mutates the DOM mid-gesture (no insertBefore while
  // dragging) — only the previous implementation did that, and it caused
  // two real bugs: (1) reflowing the tree while a pointer is captured is
  // known-flaky on WebKit and can silently drop the capture, which reads
  // as the drag just "getting stuck" mid-gesture; (2) with nothing
  // clamping the translateY offset, the item could be thrown arbitrarily
  // far past the list's own bounds, including off-screen. Fixed by only
  // ever moving the dragged item and its siblings with CSS transforms
  // (siblings slide out of the way to show where it'll land), clamped to
  // the list's actual index range, and committing the real DOM order
  // exactly once, on release.
  function initDragList(container, itemClass, onReorder) {
    container.addEventListener("pointerdown", (e) => {
      const handle = e.target.closest(".bib-drag-handle");
      if (!handle) return;
      const item = handle.closest("." + itemClass);
      if (!item || item.parentElement !== container) return;

      const items = [...container.querySelectorAll(":scope > ." + itemClass)];
      const startIndex = items.indexOf(item);
      if (startIndex === -1 || items.length < 2) return;

      const step = item.getBoundingClientRect().height + (parseFloat(getComputedStyle(container).rowGap) || 0);
      const startY = e.clientY;
      let currentIndex = startIndex;

      item.setPointerCapture(e.pointerId);
      item.classList.add("bib-drag-lift");
      item.style.position = "relative";
      item.style.zIndex = "10";
      e.preventDefault();

      function applySiblingOffsets() {
        items.forEach((el, i) => {
          if (el === item) return;
          let shift = 0;
          if (currentIndex > startIndex && i > startIndex && i <= currentIndex) shift = -step;
          else if (currentIndex < startIndex && i < startIndex && i >= currentIndex) shift = step;
          el.style.transition = "transform .15s ease";
          el.style.transform = shift ? `translateY(${shift}px)` : "";
        });
      }

      function onMove(ev) {
        const minDelta = -startIndex * step;
        const maxDelta = (items.length - 1 - startIndex) * step;
        const delta = Math.max(minDelta, Math.min(maxDelta, ev.clientY - startY));
        item.style.transform = `translateY(${delta}px)`;
        currentIndex = Math.max(0, Math.min(items.length - 1, startIndex + Math.round(delta / step)));
        applySiblingOffsets();
      }
      function onUp(ev) {
        item.releasePointerCapture(ev.pointerId);
        item.removeEventListener("pointermove", onMove);
        item.removeEventListener("pointerup", onUp);
        item.removeEventListener("pointercancel", onUp);
        item.classList.remove("bib-drag-lift");
        item.style.transform = "";
        item.style.position = "";
        item.style.zIndex = "";
        items.forEach((el) => { el.style.transition = ""; el.style.transform = ""; });

        if (currentIndex !== startIndex) {
          const reordered = items.slice();
          reordered.splice(startIndex, 1);
          reordered.splice(currentIndex, 0, item);
          reordered.forEach((el) => container.appendChild(el));
        }
        const orderedEls = [...container.querySelectorAll(":scope > ." + itemClass)];
        onReorder(orderedEls);
      }
      item.addEventListener("pointermove", onMove);
      item.addEventListener("pointerup", onUp);
      item.addEventListener("pointercancel", onUp);
    });
  }

  // ---------------------------------------------------------------------
  // State — local-first: every edit accumulates here and is only written
  // to Supabase (+ republished) on one explicit Save & republish click.
  // This is what closes off the class of bug hit earlier with per-section
  // auto-save (unsaved edits silently discarded on panel reopen) — there's
  // no longer a separate persisted-vs-pending state to fall out of sync.
  let session, page, isPaid = false;
  let headerElId = null;
  let headerContent = { business_name: "", location: "", logo_url: "", logo_shape: "circle", logo_width_pct: 50, cover_image_url: "", cover_fade: false };
  let elements = []; // all non-header elements, in position order
  let products = []; // for the Shop section's preview only — real management lives on the dashboard
  let theme = { paletteId: "coral", customAccent: PALETTES[0].primary, customBg: PALETTES[0].bg, fontPairId: "playful", buttonColor: null, customText: null };
  let expandedId = null;
  let selectedGalleryIndex = null; // index of the selected photo within the currently-open gallery panel, for editing its link
  let addMenuOpen = false;
  let editingField = null; // 'businessName' | 'location' | null
  let colorPickerOpen = null; // key of the open curated-color popover, or null (see COLOR_FIELDS)
  let dirty = false;
  let nextTempId = 1;
  const deletedIds = new Set();

  function tempId() { return "temp-" + (nextTempId++) + "-" + Date.now(); }
  function isTemp(id) { return String(id).startsWith("temp-"); }
  function isGated(type) { return !isPaid && SECTION_META[type] && SECTION_META[type].paywalled; }

  // Maps a colorFieldRowHtml key ('accent'|'bg'|'text'|'button'|'card') to
  // the theme.* property it actually drives — one place to change if a
  // field's mutation logic (e.g. accent/bg forcing paletteId to "custom")
  // needs to change, instead of duplicating it across every input type
  // (swatch grid / hex box / native fallback) that can set a color.
  function setColorFieldValue(key, value) {
    if (key === "accent") { theme.customAccent = value; theme.paletteId = "custom"; }
    else if (key === "bg") { theme.customBg = value; theme.paletteId = "custom"; }
    else if (key === "text") { theme.customText = value; }
    else if (key === "button") { theme.buttonColor = value; }
    else if (key === "card") { theme.productCardColor = value; }
  }
  function resetColorFieldValue(key) {
    if (key === "text") theme.customText = null;
    else if (key === "button") theme.buttonColor = null;
    else if (key === "card") theme.productCardColor = null;
  }
  function elById(id) { return elements.find((e) => e.id === id); }
  function markDirty() { dirty = true; }

  window.addEventListener("beforeunload", (e) => {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = "";
  });

  function showToast(message, isError) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = "bib-toast" + (isError ? " error" : "");
    toast.style.display = "flex";
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { toast.style.display = "none"; }, 2600);
  }

  // ---------------------------------------------------------------------
  // Summaries (section-card subtitle line)
  function summaryFor(el) {
    const c = el.content || {};
    switch (el.type) {
      case "about": return c.bio ? c.bio.slice(0, 44) : "No bio yet";
      case "contact": {
        const on = (c.methods || []).filter((m) => m.enabled).map((m) => m.label);
        return on.length ? on.join(", ") : "Nothing shown yet";
      }
      case "social_link": { const n = (c.links || []).length; return n ? `${n} link${n === 1 ? "" : "s"}` : "No links yet"; }
      case "portfolio_gallery": { const n = (c.photos || []).length; return n ? `${n} photo${n === 1 ? "" : "s"}` : "No photos yet"; }
      case "youtube_video": { const n = (c.videos || []).length; return n ? `${n} video${n === 1 ? "" : "s"}` : "No videos yet"; }
      case "services_list": { const n = (c.services || []).length; return n ? `${n} service${n === 1 ? "" : "s"}` : "No services yet"; }
      case "quote_request_form": { const n = (c.fields || []).filter((f) => f.enabled).length; return `${n} field${n === 1 ? "" : "s"} enabled`; }
      case "service_area": return c.area || "Not set";
      case "booking_deposit": { const on = Number(c.deposit_amount) > 0 || el._depositOn; return on ? `$${c.deposit_amount || "0"} deposit` : "Off"; }
      case "booking_calendar": return c.link ? `${c.provider === "cal_com" ? "Cal.com" : "Calendly"} — ${c.link}` : "Not set up yet";
      case "product_shop": return "Manage products on your dashboard";
      default: return "";
    }
  }

  // ---------------------------------------------------------------------
  // Editor panel — full re-render on discrete actions (add/remove/reorder/
  // toggle/expand). Text inputs mutate state directly + only refresh the
  // live preview (see wireEditorEvents), so typing never loses focus.
  function renderEditor() {
    const panel = document.getElementById("editor-panel");
    panel.innerHTML = headerCardHtml() + themeCardHtml() +
      `<div class="bib-section-heading">Page content</div>` +
      `<div id="element-list" style="display:flex;flex-direction:column;gap:10px">${elements.map(elementCardHtml).join("")}</div>` +
      `<button type="button" id="add-section-toggle" class="bib-add-section-btn">+ Add section</button>` +
      (addMenuOpen ? `<div class="bib-add-grid" id="add-section-grid">${ALL_SECTION_TYPES.map(addCardHtml).join("")}</div>` : "");
    wireEditorEvents(panel);
    if (colorPickerOpen) {
      const openPopover = panel.querySelector(".bib-color-popover");
      if (openPopover) openPopover.scrollIntoView({ block: "nearest" });
    }
    const list = document.getElementById("element-list");
    initDragList(list, "bib-el-card", (orderedEls) => {
      const byId = new Map(elements.map((e) => [e.id, e]));
      elements = orderedEls.map((el) => byId.get(el.dataset.id)).filter(Boolean);
      markDirty();
      renderPreview();
    });
  }

  // Registered once (not per-render, unlike everything wired in
  // wireEditorEvents) since it needs to catch clicks anywhere in the
  // document, including outside #editor-panel entirely — closes whichever
  // curated-color popover is open when the click didn't land on its swatch
  // button or inside the popover itself.
  document.addEventListener("click", (e) => {
    if (!colorPickerOpen) return;
    if (e.target.closest(".bib-color-popover") || e.target.closest(".bib-color-open-btn")) return;
    colorPickerOpen = null;
    renderEditor();
  });

  function headerCardHtml() {
    return `
      <div class="bib-card">
        <div class="bib-card-head">
          <div class="bib-card-icon" style="background:${hueBg(30)};color:${hueFg(30)}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 17l5-4 4 3 4-5 5 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div>
            <div class="bib-card-title">Header</div>
            <div class="bib-card-sub">Always shown first — not reorderable</div>
          </div>
        </div>
        <div style="position:relative;margin:14px -20px 0">
          <label class="bib-upload" id="h-cover-drop" style="width:100%;height:150px;border-radius:0">
            ${headerContent.cover_image_url ? `<img src="${escapeHtml(headerContent.cover_image_url)}" />` : `<span>${UPLOAD_ICON}<br/>Drop a cover photo</span>`}
            <input type="file" accept="image/*" id="h-cover-input" />
          </label>
          ${headerContent.cover_image_url ? `<button type="button" class="bib-gallery-remove bib-remove-cover" title="Remove cover photo">${CLOSE_ICON}</button>` : ""}
          ${headerContent.logo_shape !== "natural" ? `
            <label class="bib-upload" id="h-avatar-drop" style="position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.12)">
              ${headerContent.logo_url ? `<img src="${escapeHtml(headerContent.logo_url)}" />` : `<span style="font-size:10px">Photo</span>`}
              <input type="file" accept="image/*" id="h-avatar-input" />
            </label>` : ""}
        </div>
        ${headerContent.logo_shape === "natural" ? `
          <div style="margin-top:14px">
            <label class="bib-upload" id="h-avatar-drop" style="display:flex;align-items:center;justify-content:center;min-height:64px;width:100%;box-sizing:border-box;overflow:hidden;cursor:pointer;background:transparent;border:none;${headerContent.logo_url ? "" : "border:1.5px dashed var(--bib-border);border-radius:10px;padding:14px"}">
              ${headerContent.logo_url
                ? `<img src="${escapeHtml(headerContent.logo_url)}" style="width:${headerContent.logo_width_pct || 50}%;max-width:100%;height:auto;max-height:160px;object-fit:contain;display:block;margin:0 auto" />`
                : `<span class="text-muted" style="font-size:12px;text-align:center">${UPLOAD_ICON}<br/>Drop your logo (transparent PNG works best)</span>`}
              <input type="file" accept="image/*" id="h-avatar-input" />
            </label>
          </div>` : ""}
        <div style="margin-top:${headerContent.logo_shape === "natural" ? "14" : "46"}px;display:flex;flex-direction:column;gap:14px">
          ${headerContent.logo_url ? `
            <div>
              <div class="bib-field-label">Logo shape</div>
              <div style="display:flex;gap:8px">
                <button type="button" class="bib-shape-btn bib-logo-shape-btn ${headerContent.logo_shape !== "natural" ? "sel" : ""}" data-shape="circle">Circle crop</button>
                <button type="button" class="bib-shape-btn bib-logo-shape-btn ${headerContent.logo_shape === "natural" ? "sel" : ""}" data-shape="natural">Logo, uncropped</button>
              </div>
              <button type="button" class="bib-btn-text bib-remove-logo" style="margin-top:8px;padding:0;width:auto;font-size:12px;color:#d6336c">Remove logo</button>
              ${headerContent.logo_shape === "natural" ? `
                <p class="text-muted" style="font-size:11px;margin-top:6px">Best with a transparent-background PNG — no circle, no border, sized however you like.</p>
                <div style="margin-top:10px">
                  <div class="bib-field-label" style="display:flex;justify-content:space-between;margin-bottom:4px">
                    <span>Logo size</span><span id="h-logo-width-value">${headerContent.logo_width_pct || 50}%</span>
                  </div>
                  <input type="range" min="15" max="100" value="${headerContent.logo_width_pct || 50}" id="h-logo-width-input" style="width:100%" />
                </div>` : ""}
            </div>` : ""}
          ${headerContent.cover_image_url ? `
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--bib-muted);cursor:pointer">
              <input type="checkbox" id="h-cover-fade-input" ${headerContent.cover_fade ? "checked" : ""} />
              Fade cover photo into your background color
            </label>` : ""}
          <div>
            <div class="bib-field-label">Business Name / Heading</div>
            ${editingField === "businessName"
              ? `<input class="bib-edit-input" id="h-name-input" value="${escapeHtml(headerContent.business_name)}" />`
              : `<div class="bib-static-field" id="h-name-static">${escapeHtml(headerContent.business_name) || "Add your business name"}</div>`}
          </div>
          <div>
            <div class="bib-field-label">Location <span style="font-weight:400">(optional)</span></div>
            ${editingField === "location"
              ? `<input class="bib-edit-input loc" id="h-location-input" value="${escapeHtml(headerContent.location)}" style="font-size:14px;font-weight:400" />`
              : `<div class="bib-static-field loc" id="h-location-static">${escapeHtml(headerContent.location) || "Add a location"}</div>`}
          </div>
        </div>
      </div>`;
  }

  // Every custom-color field (Accent/Background/Text plus Button/Shop card)
  // renders through this one row shape — field label above, a swatch button
  // that opens the shared curated-palette popover (colorPopoverHtml), status
  // text, and an optional Reset. Keeping Accent/Background/Text on the same
  // row pattern as Button/Shop card (rather than the old compact 3-up strip)
  // is deliberate: one visual language for "pick a color" across this panel.
  function colorFieldRowHtml(opts) {
    const { key, label, value, statusText, resettable } = opts;
    return `
      <div class="bib-field-label">${label}</div>
      <div class="bib-color-field">
        <button type="button" class="bib-color-swatch-btn bib-color-open-btn" data-key="${key}" style="background:${value}" title="${value}"></button>
        <span class="text-muted" style="font-size:12px;flex:1">${statusText}</span>
        ${resettable ? `<button type="button" class="bib-btn-text bib-color-reset-btn" data-key="${key}" style="font-size:12px;padding:0;width:auto">Reset</button>` : ""}
        ${colorPickerOpen === key ? colorPopoverHtml(key, value) : ""}
      </div>`;
  }

  // Grouped swatch grid (COLOR_FAMILIES, defined in app.js) plus a fallback
  // hex/native picker for anyone who wants an exact color the curated set
  // doesn't cover — swapped in place of a bare <input type="color"> so
  // picking a color is "choose from something that already looks good" by
  // default, not "find your way around a rainbow square."
  function colorPopoverHtml(key, value) {
    const norm = String(value || "").toLowerCase();
    return `
      <div class="bib-color-popover" data-key="${key}" onclick="event.stopPropagation()">
        ${COLOR_FAMILIES.map((fam) => `
          <div class="bib-color-family">
            <div class="bib-color-family-label">${escapeHtml(fam.label)}</div>
            <div class="bib-color-grid">
              ${fam.colors.map((c) => `<button type="button" class="bib-color-cell bib-color-pick-btn ${c.toLowerCase() === norm ? "sel" : ""}" data-key="${key}" data-color="${c}" style="background:${c}" title="${c}"></button>`).join("")}
            </div>
          </div>`).join("")}
        <div class="bib-color-popover-footer">
          <input type="color" class="bib-color-native-input bib-color-native-input-el" data-key="${key}" value="${/^#[0-9a-f]{6}$/i.test(norm) ? norm : "#000000"}" title="Pick any color" />
          <input type="text" class="bib-color-hex-input bib-color-hex-input-el" data-key="${key}" value="${escapeHtml(value)}" maxlength="9" spellcheck="false" placeholder="#hex" />
        </div>
      </div>`;
  }

  function themeCardHtml() {
    const isCustom = theme.paletteId === "custom";
    const buttonColorValue = theme.buttonColor || (isCustom ? theme.customAccent : (PALETTES.find((p) => p.id === theme.paletteId) || PALETTES[0]).primary);
    return `
      <div class="bib-card" style="position:relative;z-index:5">
        <div class="bib-card-head" style="margin-bottom:16px">
          <div class="bib-card-icon" style="background:${hueBg(300)};color:${hueFg(300)}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="13.5" cy="6.5" r="3" fill="currentColor"/><circle cx="6" cy="12" r="3" fill="currentColor"/><circle cx="17" cy="17.5" r="3" fill="currentColor"/></svg>
          </div>
          <div>
            <div class="bib-card-title">Theme</div>
            <div class="bib-card-sub">Colors &amp; fonts for your live page</div>
          </div>
        </div>
        <div class="bib-field-label">Color palette</div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:${isCustom ? "18px" : "18px"}">
          ${PALETTES.map((p) => `<button type="button" class="bib-swatch bib-palette-btn ${theme.paletteId === p.id ? "sel" : ""}" data-id="${p.id}" style="background:${p.primary};--swatch-ring:${p.primary}" title="${escapeHtml(p.label)}"></button>`).join("")}
          <button type="button" class="bib-swatch bib-custom-swatch bib-select-custom-btn ${isCustom ? "sel" : ""}" style="--swatch-ring:oklch(40% 0.02 50)" title="Custom"></button>
        </div>
        ${isCustom ? `
          ${colorFieldRowHtml({ key: "accent", label: "Accent", value: theme.customAccent, statusText: "Your page's accent color", resettable: false })}
          ${colorFieldRowHtml({ key: "bg", label: "Background", value: theme.customBg, statusText: "Your page's background color", resettable: false })}
          ${colorFieldRowHtml({ key: "text", label: "Text", value: theme.customText || contrastTextColor(theme.customBg, CUSTOM_TEXT), statusText: theme.customText ? "Custom text color set" : "Auto-picks black or white for contrast", resettable: !!theme.customText })}
        ` : ""}
        ${colorFieldRowHtml({ key: "button", label: "Button color", value: buttonColorValue, statusText: theme.buttonColor ? "Custom button color set" : "Using your theme's accent color", resettable: !!theme.buttonColor })}
        ${products.length ? colorFieldRowHtml({ key: "card", label: "Shop card color", value: theme.productCardColor || "#ffffff", statusText: theme.productCardColor ? "Custom card color set" : "Using the default frosted-glass look", resettable: !!theme.productCardColor }) : ""}
        <div class="bib-field-label">Font pairing</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          ${FONT_PAIRS.map((f) => `
            <button type="button" class="bib-fontpair-btn bib-fontpair-item ${theme.fontPairId === f.id ? "sel" : ""}" data-id="${f.id}">
              <div class="bib-fontpair-aa" style='font-family:${f.display}'>Aa</div>
              <div class="bib-fontpair-name">${escapeHtml(f.label)}</div>
            </button>`).join("")}
        </div>
      </div>`;
  }

  function elementCardHtml(el) {
    const meta = SECTION_META[el.type];
    const gated = isGated(el.type);
    const isOpen = expandedId === el.id;
    return `
      <div class="bib-el-card" data-id="${el.id}">
        <div class="bib-el-head bib-el-toggle" data-id="${el.id}">
          <span class="bib-drag-handle">${GRIP_ICON}</span>
          <div class="bib-el-icon" style="background:${hueBg(meta.hue)};color:${hueFg(meta.hue)}">${sectionIconSvg(el.type, 15)}</div>
          <div style="flex:1;min-width:0">
            <div class="bib-el-title">${escapeHtml(meta.title)}</div>
            <div class="bib-el-summary">${escapeHtml(summaryFor(el))}</div>
          </div>
          <button type="button" class="bib-icon-btn bib-remove-el-btn" data-id="${el.id}" title="Delete section">${TRASH_ICON}</button>
          <span class="bib-chevron" style="transform:rotate(${isOpen ? "180deg" : "0deg"})">${CHEVRON_ICON}</span>
        </div>
        ${isOpen ? `<div class="bib-el-panel">${gated ? gatedBannerHtml(meta.hue) : ""}${sectionEditorHtml(el)}</div>` : ""}
      </div>`;
  }

  function gatedBannerHtml(hue) {
    return `
      <div class="bib-gated-banner" style="background:${hueBannerBg(hue)};color:${hueBannerFg(hue)}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${hueFg(hue)}" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
        <div>Part of <strong>All Access</strong> ($9.99/mo) — saved now, goes live once you <a href="/app/dashboard.html">upgrade</a>.</div>
      </div>`;
  }

  function sectionEditorHtml(el) {
    const c = el.content || {};
    switch (el.type) {
      case "about":
        return `<textarea class="bib-textarea bib-about-input" data-id="${el.id}" placeholder="Tell people what you do...">${escapeHtml(c.bio || "")}</textarea>`;

      case "contact":

  const REPEATABLE_TYPES = new Set(["services_list", "portfolio_gallery", "youtube_video"]);

  function addCardHtml(type) {
    const meta = SECTION_META[type];
    const gated = isGated(type);
    const alreadyAdded = !REPEATABLE_TYPES.has(type) && elements.some((e) => e.type === type);
    return `
      <button type="button" class="bib-add-card bib-add-section-item" data-type="${type}" data-gated="${gated}" ${alreadyAdded ? "disabled" : ""} style="${alreadyAdded ? "opacity:.55;cursor:not-allowed" : ""}">
        ${meta.paywalled ? `<div class="bib-all-access-badge">ALL ACCESS</div>` : ""}

        <div class="bib-add-title" style="color:${alreadyAdded ? "oklch(65% 0.015 60)" : "var(--bib-text)"}">${escapeHtml(meta.title)}</div>
      </button>`;
  }

  // ---------------------------------------------------------------------
  // Live preview — fetches render-page's preview mode (same buildHtml()
  // that publishes the real site) with the current in-memory draft state
  // and drops the returned HTML straight into the phone's iframe via
  // srcdoc. There is exactly one render implementation; the mockup cannot
  // drift from what a customer actually sees. Debounced so rapid typing
  // doesn't fire a network round-trip per keystroke.
  //
  // One deliberate behavior change from the old hand-rolled mock: gated
  // (paywalled) sections used to render here anyway with an "All Access"
  // ribbon, as an upsell preview. render-page's real tier gating hides
  // them entirely for a free-tier page, so this preview now does too —
  // that's what "exact display of the customer's site" requires. The
  // per-section paywall banners in the editor panel are unaffected.
  let previewDebounceTimer = null;
  let previewRequestSeq = 0;

  // The iframe's own box is always exactly 390x844 (see .bib-phone-screen)
  // so its content renders at true device pixels no matter how small the
  // bezel graphic gets squeezed on a short window — visually fitting it
  // into whatever size the bezel actually is is a pure CSS scale of that
  // fixed canvas, done here rather than left to the browser, since letting
  // the iframe's own box shrink is what caused fixed-px content (e.g. a
  // 120px avatar) to look oversized relative to a shrunken frame.
  function scalePreviewToFit() {
    const phone = document.querySelector(".bib-phone");
    const screenEl = document.getElementById("preview-screen");
    if (!phone || !screenEl) return;
    const scale = phone.clientWidth / 390;
    screenEl.style.transform = `scale(${scale})`;
  }
  new ResizeObserver(scalePreviewToFit).observe(document.querySelector(".bib-phone"));
  window.addEventListener("resize", scalePreviewToFit);
  scalePreviewToFit();

  function renderPreview() {
    clearTimeout(previewDebounceTimer);
    previewDebounceTimer = setTimeout(fetchPreview, 280);
  }

  function draftElementsForPreview() {
    const header = { id: headerElId || "draft-header", type: "header", position: 0, content: headerContent };
    const rest = elements.map((el, i) => ({ id: el.id, type: el.type, position: i + 1, content: el.content }));
    return [header, ...rest];
  }

  function previewErrorHtml() {
    return `<div style="font-family:sans-serif;padding:24px;color:#900;font-size:13px">Preview failed to load.</div>`;
  }

  async function fetchPreview() {
    if (!page) return;
    const seq = ++previewRequestSeq;
    const screen = document.getElementById("preview-screen");
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/render-page`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${session ? session.access_token : SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({
          page_id: page.id,
          preview: true,
          elements: draftElementsForPreview(),
          page_overrides: {
            business_name: headerContent.business_name,
            theme: theme.paletteId,
            custom_accent_color: theme.customAccent || null,
            custom_bg_color: theme.customBg || null,
            custom_text_color: theme.customText || null,
            font_pair: theme.fontPairId,
            button_color: theme.buttonColor || null,
            product_card_color: theme.productCardColor || null,
          },
        }),
      });
      if (seq !== previewRequestSeq) return;
      const html = await res.text();
      if (seq !== previewRequestSeq) return;
      screen.srcdoc = res.ok ? html : previewErrorHtml();
    } catch {
      if (seq === previewRequestSeq) screen.srcdoc = previewErrorHtml();
    }
  }

  function wireImageDrop(dropEl, inputEl, onUploaded) {
    if (!dropEl || !inputEl) return;
    inputEl.addEventListener("change", (e) => { if (e.target.files[0]) uploadImage(e.target.files[0], onUploaded); });
    dropEl.addEventListener("dragover", (e) => { e.preventDefault(); dropEl.classList.add("drag-over"); });
    dropEl.addEventListener("dragleave", () => dropEl.classList.remove("drag-over"));
    dropEl.addEventListener("drop", (e) => {
      e.preventDefault();
      dropEl.classList.remove("drag-over");
      const file = e.dataTransfer.files[0];
      if (file) uploadImage(file, onUploaded);
    });
  }

  async function uploadImage(file, onUploaded) {
    const path = `${session.user.id}/${Date.now()}-${file.name}`;
    const { error } = await sb.storage.from("page-photos").upload(path, file);
    if (error) { alert("Upload failed: " + error.message); return; }
    const { data } = sb.storage.from("page-photos").getPublicUrl(path);
    onUploaded(data.publicUrl);
    markDirty();
    renderEditor(); renderPreview();
  }

  function wireGalleryDrop(dropEl, inputEl, elId) {
    if (!dropEl || !inputEl) return;
    inputEl.addEventListener("change", (e) => { if (e.target.files.length) uploadGalleryPhotos(elId, e.target.files); });
    dropEl.addEventListener("dragover", (e) => { e.preventDefault(); dropEl.classList.add("drag-over"); });
    dropEl.addEventListener("dragleave", () => dropEl.classList.remove("drag-over"));
    dropEl.addEventListener("drop", (e) => {
      e.preventDefault();
      dropEl.classList.remove("drag-over");
      if (e.dataTransfer.files.length) uploadGalleryPhotos(elId, e.dataTransfer.files);
    });
  }

  async function uploadGalleryPhotos(elId, files) {
    const el = elById(elId);
    if (!el.content.photos) el.content.photos = [];
    for (const file of files) {
      const path = `${session.user.id}/${Date.now()}-${file.name}`;
      const { error } = await sb.storage.from("page-photos").upload(path, file);
      if (error) { alert("Upload failed: " + error.message); continue; }
      const { data } = sb.storage.from("page-photos").getPublicUrl(path);
      el.content.photos.push({ url: data.publicUrl, link: "" });
    }
    markDirty();
    renderEditor(); renderPreview();
  }

  // ---------------------------------------------------------------------
  // Save & republish — the single persistence point for every edit made
  // since load (or since the last save).
  async function saveAndRepublish() {
    const btn = document.getElementById("save-republish-btn");
    btn.disabled = true;
    btn.textContent = "Saving...";
    try {
      elements.forEach((el) => {
        if (el.type === "social_link" && el.content.links) {
          el.content.links.forEach((l) => { l.url = normalizeUrl(l.url); });
        }
        if (el.type === "portfolio_gallery" && el.content.photos) {
          el.content.photos.forEach((p) => { if (p.link) p.link = normalizeUrl(p.link); });
        }
        if (el.type === "booking_deposit" && !el._depositOn && !(Number(el.content.deposit_amount) > 0)) {
          el.content.deposit_amount = "";
        }
      });

      if (headerElId) {
        const { error } = await sb.from("elements").update({ content: headerContent }).eq("id", headerElId);
        if (error) throw error;
      } else {
        const { data, error } = await sb.from("elements").insert({ page_id: page.id, type: "header", position: 0, content: headerContent }).select().single();
        if (error) throw error;
        headerElId = data.id;
      }

      // Deletes run before inserts/updates — a singleton-type section (see
      // elements_singleton_type_idx) that got deleted and re-added within
      // the same unsaved session would otherwise still have its old DB row
      // around when the new temp element's insert runs right after it,
      // colliding on (page_id, type) even though the old row is already
      // marked for removal.
      if (deletedIds.size) {
        const { error } = await sb.from("elements").delete().in("id", [...deletedIds]);
        if (error) throw error;
        deletedIds.clear();
      }

      for (let i = 0; i < elements.length; i++) {
        const el = elements[i];
        if (isTemp(el.id)) {
          const { data, error } = await sb.from("elements").insert({ page_id: page.id, type: el.type, position: i + 1, content: el.content }).select().single();
          if (error) throw error;
          el.id = data.id;
        } else {
          const { error } = await sb.from("elements").update({ content: el.content, position: i + 1 }).eq("id", el.id);
          if (error) throw error;
        }
      }

      const { error: pageErr } = await sb.from("pages").update({
        business_name: headerContent.business_name,
        og_title: headerContent.business_name,
        theme: theme.paletteId,
        custom_accent_color: theme.customAccent || null,
        custom_bg_color: theme.customBg || null,
        font_pair: theme.fontPairId,
        button_color: theme.buttonColor || null,
        custom_text_color: theme.customText || null,
        product_card_color: theme.productCardColor || null,
      }).eq("id", page.id);
      if (pageErr) throw pageErr;
      page.business_name = headerContent.business_name;
      page.theme = theme.paletteId;

      await callFunction("render-page", { page_id: page.id }, session);

      dirty = false;
      showToast("Saved — live in a few seconds");
    } catch (err) {
      showToast(err.message || "Something went wrong.", true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Save & publish";
    }
  }
  document.getElementById("save-republish-btn").addEventListener("click", saveAndRepublish);

  // Mobile Edit/Preview tabs — no-op above the 860px breakpoint (the tab
  // bar is display:none there and .bib-body's side-by-side layout already
  // shows both panes), so this is safe to wire unconditionally.
  document.querySelectorAll(".bib-mobile-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".bib-mobile-tab").forEach((b) => b.classList.toggle("active", b === btn));
      document.getElementById("bib-body").classList.toggle("bib-mobile-preview", btn.dataset.view === "preview");
    });
  });

  // ---------------------------------------------------------------------
  (async () => {
    session = await requireSession();
    if (!session) return;

    const { data: pageData } = await sb.from("pages").select("*").eq("user_id", session.user.id).maybeSingle();
    if (!pageData) { window.location.href = "/app/onboarding.html"; return; }
    page = pageData;

    theme = {
      paletteId: page.theme || "coral",
      customAccent: page.custom_accent_color || PALETTES[0].primary,
      customBg: page.custom_bg_color || PALETTES[0].bg,
      customText: page.custom_text_color || null,
      fontPairId: page.font_pair || "playful",
      buttonColor: page.button_color || null,
      productCardColor: page.product_card_color || null,
    };

    const { data: sub } = await sb.from("subscriptions").select("tier, status").eq("user_id", session.user.id).maybeSingle();
    isPaid = !!(sub && sub.status === "active");

    const { data: productRows } = await sb.from("products").select("id, name, price_cents, compare_at_price_cents, image_urls").eq("page_id", page.id).eq("active", true).order("position", { ascending: true });
    products = productRows || [];

    document.getElementById("page-url").href = `https://bizinbio.net/${page.slug}/`;
    document.getElementById("page-url").textContent = `bizinbio.net/${page.slug}/`;
    document.getElementById("status-badge").href = `https://bizinbio.net/${page.slug}/`;
    document.getElementById("status-badge-text").textContent = page.published ? "Live" : "Not published yet";

    const { data: elData } = await sb.from("elements").select("*").eq("page_id", page.id).order("position", { ascending: true });
    const all = elData || [];
    const header = all.find((e) => e.type === "header");
    if (header) {
      headerElId = header.id;
      headerContent = { business_name: "", location: "", logo_url: "", logo_shape: "circle", logo_width_pct: 50, cover_image_url: "", cover_fade: false, ...header.content };
    }
    elements = all.filter((e) => e.type !== "header").map((e) => {
      if (e.type === "booking_deposit") e._depositOn = Number(e.content.deposit_amount) > 0;
      if (e.type === "quote_request_form") {
        e.content = {
          heading: "Request a quote", prompt_placeholder: "Tell us what you need", button_text: "Send request",
          display_style: "inline", popup_delay_seconds: 5, ...e.content,
        };
        const fields = Array.isArray(e.content.fields) ? e.content.fields.slice() : [];
        if (!fields.some((f) => f.id === "address")) fields.push({ id: "address", label: "Address", enabled: false });
        e.content.fields = fields;
      }
      return e;
    });

    renderEditor();
    renderPreview();
  })();
</script>
</body>
